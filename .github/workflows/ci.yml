name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: pip install pytest
      - name: Unit / adversarial / legacy
        run: python -m pytest tests/unit tests/adversarial tests/legacy -q
      - name: Integration (live daemons, loopback)
        run: python -m pytest tests/integration -q
      - name: Conformance (NECS + adapter mocks)
        run: python -m pytest tests/conformance -q
      - name: Stdlib runner parity (no-pytest environments)
        run: python scripts/run_acceptance.py
