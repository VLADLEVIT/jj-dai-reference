[build-system]
# EXACT, not a floor. `setuptools>=68` resolved to whatever PyPI served at
# build time, which makes the wheel a function of the calendar.
#
# This is a version pin and NOT a hash pin, and it cannot be one: PEP 517
# gives `requires` no place to put a digest. v0.6.9 closes the gap OUTSIDE
# this file (ADR-022 D4) — the backend wheel and every dependency are
# vendored under `vendor/build-backend/`, pinned by sha256 in
# `vendor/build-backend/PINS.json`, and `scripts/build_release.py` verifies
# each digest BEFORE installing anything, then builds with
# `--no-build-isolation` in the environment it prepared. The version here
# and the pin there must agree; BLD-2 checks that they do.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jjdai"
version = "0.6.9"
description = "JJ DAI reference trust, governance and agent kernel (stdlib-only)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
# NECS specification and harness (necs/) are Apache-2.0 — see LICENSE.

[tool.setuptools]
# LIBRARY scope by design: the importable trust kernel only. The node
# daemon (node/), the NECS harness (necs/) and scripts/ are NOT packaged —
# they are run from a checkout, not installed. A runnable distribution is a
# separate deliverable (see README §5).
# Controlled discovery, not a hand-written list. The hand-written list
# silently dropped jjdai.adapters (and its backends/, models/, formats/)
# from every wheel built after v0.6.5 — invisible when running from a
# checkout, fatal for anyone installing the library. WHEEL-PKG-1 imports
# the subpackages out of a built wheel so the omission cannot recur.
packages = [
    "jjdai", "jjdai.adapters", "jjdai.adapters.backends",
    "jjdai.adapters.formats",
    "core", "kernel", "runtime",
]
# NOTE: `node/` is deliberately NOT a package. It is a script directory whose
# modules import their siblings by bare name (`from authz import ...`), which
# only works because the daemon puts its own directory on sys.path. Packaging
# it would break those imports rather than fix anything. The runnable node
# stays a separate deliverable, as the audit allows — what must not happen is
# the LIBRARY silently losing its own adapter layer, which is what did happen.
# Model-family profiles are DATA the adapter layer needs at runtime, not
# documentation. A wheel that ships the code and drops the profiles is a
# wheel whose registry refuses every model it advertises.
[tool.setuptools.package-data]
"jjdai.adapters" = ["models/*.json", "models/*.yaml"]

[tool.pytest.ini_options]
# testpaths names the DEFAULT set POSITIVELY, group by group. It used to be
# the single entry `tests`, which made the default set a subtraction —
# everything under tests/, minus whatever --ignore removed. A subtractive
# default is silently wrong the moment somebody adds a directory: a new
# group is collected and counted before anyone decides it should be. This
# form fails the other way, which is the way that gets noticed.
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/conformance",
    "tests/adversarial",
    "tests/compatibility",
]
# `tests/live` is the OPT-IN group: it needs a real wasm runtime and a real
# model on the host and RAISES rather than skipping when they are absent.
# scripts/run_acceptance.py has excluded it from the default run since
# v0.6.4; pytest did not, so `pytest tests/` collected 212 and failed on any
# host without wasmtime while the runner reported a clean 206. Two entrypoints
# that disagree about what "the suite" means produce two different truths
# about the same tree.
#
# BOTH mechanisms are here on purpose and they cover different commands:
#   * testpaths above governs a bare `pytest` — five groups, no live;
#   * --ignore governs `pytest tests/`, where the explicit directory argument
#     makes testpaths irrelevant and recursion would otherwise reach live.
# --ignore prunes during RECURSION only, so an explicitly named path still
# collects: `pytest tests/live` runs the six live checks with this line in
# force. That is verified by ENTRY-3 rather than assumed — an audit round
# read the same line as blocking the explicit command, which is the reading
# to expect from anyone who has not run it.
addopts = "-q --ignore=tests/live"
